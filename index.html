<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスク管理 App - TaskFlow</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="h-full text-slate-800 antialiased flex flex-col font-sans">

    <!-- Navigation Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md shadow-indigo-100 flex items-center justify-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">TaskFlow</h1>
                    <p class="text-xs text-slate-400 font-medium hidden sm:block">Firebase タスク管理アプリ</p>
                </div>
            </div>

            <!-- Auth Status / User Profile -->
            <div id="authContainer" class="flex items-center space-x-3">
                <!-- Loading state indicator -->
                <div id="authLoading" class="text-sm text-slate-400 flex items-center space-x-2">
                    <svg class="w-4 h-4 animate-spin text-indigo-500" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>読み込み中...</span>
                </div>

                <!-- Logged Out State -->
                <button id="loginBtn" class="hidden items-center space-x-2 bg-white hover:bg-slate-50 text-slate-700 font-semibold px-4 py-2 border border-slate-300 rounded-xl shadow-sm transition duration-150 ease-in-out active:scale-95">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Googleでログイン</span>
                </button>

                <!-- Logged In State -->
                <div id="userProfile" class="hidden items-center space-x-3">
                    <img id="userAvatar" src="" alt="Avatar" class="w-9 h-9 rounded-full ring-2 ring-indigo-500/30 object-cover">
                    <div class="hidden md:block text-left">
                        <p id="userName" class="text-sm font-semibold text-slate-700 leading-tight"></p>
                        <p id="userEmail" class="text-xs text-slate-400 leading-tight truncate max-w-[150px]"></p>
                    </div>
                    <button id="logoutBtn" title="ログアウト" class="text-slate-400 hover:text-slate-600 p-2 rounded-lg hover:bg-slate-100 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

        <!-- Unauthenticated View Banner -->
        <div id="loggedOutBanner" class="hidden bg-gradient-to-br from-indigo-500 via-indigo-600 to-purple-600 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden">
            <div class="max-w-xl relative z-10 space-y-4">
                <span class="inline-block bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold tracking-wider uppercase">Firebase リアルタイム同期</span>
                <h2 class="text-3xl sm:text-4xl font-extrabold tracking-tight leading-tight">スマートにタスクを整理・管理しよう</h2>
                <p class="text-indigo-100 text-sm sm:text-base leading-relaxed">
                    Googleアカウントでログインすると、Firestoreデータベースにタスクが安全に保存され、どのデバイスからでもリアルタイムにアクセスできます。
                </p>
                <button id="bannerLoginBtn" class="mt-2 inline-flex items-center space-x-2 bg-white text-indigo-700 font-bold px-6 py-3 rounded-xl shadow-lg hover:bg-indigo-50 transition transform active:scale-95">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>今すぐログインして始める</span>
                </button>
            </div>
        </div>

        <!-- Dashboard Analytics (Logged in view) -->
        <div id="dashboardStats" class="hidden grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">すべてのタスク</p>
                    <p id="statTotal" class="text-2xl font-bold text-slate-800 mt-1">0</p>
                </div>
                <div class="bg-slate-100 text-slate-600 p-3 rounded-xl">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
                    </svg>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-amber-500 uppercase tracking-wider">進行中</p>
                    <p id="statActive" class="text-2xl font-bold text-amber-600 mt-1">0</p>
                </div>
                <div class="bg-amber-50 text-amber-600 p-3 rounded-xl">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-emerald-500 uppercase tracking-wider">完了済み</p>
                    <p id="statCompleted" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
                </div>
                <div class="bg-emerald-50 text-emerald-600 p-3 rounded-xl">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-rose-500 uppercase tracking-wider">優先度：高</p>
                    <p id="statHighPriority" class="text-2xl font-bold text-rose-600 mt-1">0</p>
                </div>
                <div class="bg-rose-50 text-rose-600 p-3 rounded-xl">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- App Controls & Filters -->
        <div id="appControls" class="hidden flex flex-col md:flex-row gap-4 items-center justify-between bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
            <!-- Search & Filters -->
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <!-- Search Box -->
                <div class="relative flex-1 sm:w-64">
                    <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="タスクを検索..." 
                        class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                </div>

                <!-- Status Filter -->
                <select id="statusFilter" class="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="all">すべてのステータス</option>
                    <option value="active">進行中</option>
                    <option value="completed">完了</option>
                </select>

                <!-- Category Filter -->
                <select id="categoryFilter" class="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="all">すべてのカテゴリ</option>
                    <option value="work">仕事</option>
                    <option value="personal">個人</option>
                    <option value="shopping">買い物</option>
                    <option value="other">その他</option>
                </select>
            </div>

            <!-- New Task Button -->
            <button id="openAddTaskModalBtn" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2.5 rounded-xl shadow-md shadow-indigo-200 flex items-center justify-center space-x-2 transition active:scale-95">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                <span>新しいタスク</span>
            </button>
        </div>

        <!-- Task List Area -->
        <div id="taskListContainer" class="hidden space-y-3">
            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300 p-8">
                <div class="w-16 h-16 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                    </svg>
                </div>
                <h3 class="text-lg font-bold text-slate-700 mb-1">該当するタスクはありません</h3>
                <p class="text-slate-400 text-sm max-w-sm mx-auto">新しいタスクを追加するか、検索・フィルターの条件を変更してください。</p>
            </div>

            <!-- List items dynamically generated here -->
            <div id="tasksList" class="space-y-3"></div>
        </div>

    </main>

    <!-- Task Modal (Add/Edit) -->
    <div id="taskModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden transition-opacity duration-200">
        <div class="bg-white rounded-2xl max-w-lg w-full shadow-2xl overflow-hidden transform transition-all">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800">新規タスク追加</h3>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Modal Form -->
            <form id="taskForm" class="p-6 space-y-4">
                <input type="hidden" id="taskId">
                
                <!-- Title -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">タイトル <span class="text-rose-500">*</span></label>
                    <input type="text" id="taskTitleInput" required placeholder="例: 明日のミーティング資料作成" 
                        class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                </div>

                <!-- Description -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">詳細メモ</label>
                    <textarea id="taskDescInput" rows="3" placeholder="タスクの具体的な内容やメモを記入..." 
                        class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"></textarea>
                </div>

                <!-- Grid Options: Priority, Category, Due Date -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <!-- Priority -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">優先度</label>
                        <select id="taskPriorityInput" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="low">低</option>
                            <option value="medium" selected>中</option>
                            <option value="high">高</option>
                        </select>
                    </div>

                    <!-- Category -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">カテゴリ</label>
                        <select id="taskCategoryInput" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="work">仕事</option>
                            <option value="personal">個人</option>
                            <option value="shopping">買い物</option>
                            <option value="other">その他</option>
                        </select>
                    </div>

                    <!-- Due Date -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">期限日</label>
                        <input type="date" id="taskDueDateInput" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <!-- Buttons -->
                <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-100">
                    <button type="button" id="cancelModalBtn" class="px-4 py-2 text-slate-600 font-semibold text-sm hover:bg-slate-100 rounded-xl transition">キャンセル</button>
                    <button type="submit" id="saveTaskBtn" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl shadow-md shadow-indigo-100 transition flex items-center space-x-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                        <span>保存する</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div id="deleteModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl space-y-4">
            <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto text-xl">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
            </div>
            <h3 class="text-lg font-bold text-slate-800">タスクの削除</h3>
            <p class="text-sm text-slate-500">このタスクを削除してもよろしいですか？この操作は取り消せません。</p>
            <div class="flex items-center justify-center space-x-3 pt-2">
                <button id="cancelDeleteBtn" class="px-4 py-2 border border-slate-200 rounded-xl text-slate-600 text-sm font-semibold hover:bg-slate-50">キャンセル</button>
                <button id="confirmDeleteBtn" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white text-sm font-semibold rounded-xl shadow-md shadow-rose-200">削除する</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none flex items-center space-x-3 bg-slate-800 text-white px-4 py-3 rounded-2xl shadow-xl">
        <div id="toastIcon"></div>
        <span id="toastMessage" class="text-sm font-medium"></span>
    </div>

    <script type="module">
        // Firebase Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            doc, 
            onSnapshot, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Provided Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDLmZ2HaepCjwsrjyRT2XnX0L_LD3OR-X0",
            authDomain: "task-750c4.firebaseapp.com",
            projectId: "task-750c4",
            storageBucket: "task-750c4.firebasestorage.app",
            messagingSenderId: "78443563761",
            appId: "1:78443563761:web:d3dc2f790ff982815af750"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Application State
        let currentUser = null;
        let tasks = [];
        let unsubscribeTasks = null;
        let deleteTargetTaskId = null;

        // DOM Elements
        const authLoading = document.getElementById('authLoading');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userProfile = document.getElementById('userProfile');
        const userAvatar = document.getElementById('userAvatar');
        const userName = document.getElementById('userName');
        const userEmail = document.getElementById('userEmail');
        
        const loggedOutBanner = document.getElementById('loggedOutBanner');
        const bannerLoginBtn = document.getElementById('bannerLoginBtn');
        const dashboardStats = document.getElementById('dashboardStats');
        const appControls = document.getElementById('appControls');
        const taskListContainer = document.getElementById('taskListContainer');
        const tasksList = document.getElementById('tasksList');
        const emptyState = document.getElementById('emptyState');

        // Form & Modals
        const taskModal = document.getElementById('taskModal');
        const taskForm = document.getElementById('taskForm');
        const modalTitle = document.getElementById('modalTitle');
        const taskIdInput = document.getElementById('taskId');
        const taskTitleInput = document.getElementById('taskTitleInput');
        const taskDescInput = document.getElementById('taskDescInput');
        const taskPriorityInput = document.getElementById('taskPriorityInput');
        const taskCategoryInput = document.getElementById('taskCategoryInput');
        const taskDueDateInput = document.getElementById('taskDueDateInput');

        const openAddTaskModalBtn = document.getElementById('openAddTaskModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');

        const deleteModal = document.getElementById('deleteModal');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');

        // Search & Filters
        const searchInput = document.getElementById('searchInput');
        const statusFilter = document.getElementById('statusFilter');
        const categoryFilter = document.getElementById('categoryFilter');

        // Listen to Auth State Changes
        onAuthStateChanged(auth, (user) => {
            authLoading.classList.add('hidden');
            currentUser = user;

            if (user) {
                // Logged In UI
                userAvatar.src = user.photoURL || 'https://via.placeholder.com/40';
                userName.textContent = user.displayName || 'ユーザー';
                userEmail.textContent = user.email || '';
                
                loginBtn.classList.add('hidden');
                userProfile.classList.remove('hidden');
                userProfile.classList.add('flex');

                loggedOutBanner.classList.add('hidden');
                dashboardStats.classList.remove('hidden');
                appControls.classList.remove('hidden');
                taskListContainer.classList.remove('hidden');

                // Load User Tasks
                subscribeUserTasks(user.uid);
                showToast(`おかえりなさい、${user.displayName || ''} さん`);
            } else {
                // Logged Out UI
                loginBtn.classList.remove('hidden');
                loginBtn.classList.add('flex');
                userProfile.classList.add('hidden');

                loggedOutBanner.classList.remove('hidden');
                dashboardStats.classList.add('hidden');
                appControls.classList.add('hidden');
                taskListContainer.classList.add('hidden');

                tasks = [];
                if (unsubscribeTasks) unsubscribeTasks();
            }
        });

        // Google Login Action
        const handleLogin = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login Error:", error);
                showToast("ログインに失敗しました: " + error.message, "error");
            }
        };

        loginBtn.addEventListener('click', handleLogin);
        bannerLoginBtn.addEventListener('click', handleLogin);

        // Logout Action
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
                showToast("ログアウトしました");
            } catch (error) {
                console.error("Logout Error:", error);
            }
        });

        // Firestore Realtime Subscription (Mandatory Path Pattern)
        function subscribeUserTasks(userId) {
            if (unsubscribeTasks) unsubscribeTasks();

            const tasksCollection = collection(db, 'artifacts', 'task-flow-app', 'users', userId, 'tasks');
            
            unsubscribeTasks = onSnapshot(tasksCollection, (snapshot) => {
                tasks = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));

                // Memory Sort (Rule: Sort in JS to prevent compound index requirement errors)
                tasks.sort((a, b) => {
                    const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
                    const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
                    return timeB - timeA;
                });

                renderApp();
            }, (error) => {
                console.error("Firestore error:", error);
                showToast("タスクの読み込みエラーが発生しました", "error");
            });
        }

        // Open Modal (New or Edit)
        function openTaskModal(task = null) {
            if (task) {
                modalTitle.textContent = "タスクの編集";
                taskIdInput.value = task.id;
                taskTitleInput.value = task.title || "";
                taskDescInput.value = task.description || "";
                taskPriorityInput.value = task.priority || "medium";
                taskCategoryInput.value = task.category || "work";
                taskDueDateInput.value = task.dueDate || "";
            } else {
                modalTitle.textContent = "新規タスク追加";
                taskForm.reset();
                taskIdInput.value = "";
                taskPriorityInput.value = "medium";
                taskCategoryInput.value = "work";
            }
            taskModal.classList.remove('hidden');
        }

        function closeTaskModal() {
            taskModal.classList.add('hidden');
            taskForm.reset();
        }

        openAddTaskModalBtn.addEventListener('click', () => openTaskModal());
        closeModalBtn.addEventListener('click', closeTaskModal);
        cancelModalBtn.addEventListener('click', closeTaskModal);

        // Save Task (Add or Update)
        taskForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const taskId = taskIdInput.value;
            const taskData = {
                title: taskTitleInput.value.trim(),
                description: taskDescInput.value.trim(),
                priority: taskPriorityInput.value,
                category: taskCategoryInput.value,
                dueDate: taskDueDateInput.value,
                updatedAt: serverTimestamp()
            };

            try {
                if (taskId) {
                    // Update Task
                    const taskRef = doc(db, 'artifacts', 'task-flow-app', 'users', currentUser.uid, 'tasks', taskId);
                    await updateDoc(taskRef, taskData);
                    showToast("タスクを更新しました");
                } else {
                    // Create Task
                    taskData.completed = false;
                    taskData.createdAt = serverTimestamp();
                    const tasksCollection = collection(db, 'artifacts', 'task-flow-app', 'users', currentUser.uid, 'tasks');
                    await addDoc(tasksCollection, taskData);
                    showToast("新しいタスクを追加しました");
                }
                closeTaskModal();
            } catch (error) {
                console.error("Error saving task:", error);
                showToast("保存に失敗しました", "error");
            }
        });

        // Toggle Task Completion State
        async function toggleTaskComplete(task) {
            if (!currentUser) return;
            try {
                const taskRef = doc(db, 'artifacts', 'task-flow-app', 'users', currentUser.uid, 'tasks', task.id);
                await updateDoc(taskRef, {
                    completed: !task.completed
                });
                showToast(task.completed ? "タスクを未完了に戻しました" : "タスクを完了にしました！");
            } catch (error) {
                console.error("Toggle error:", error);
            }
        }

        // Delete Task Logic
        function promptDeleteTask(taskId) {
            deleteTargetTaskId = taskId;
            deleteModal.classList.remove('hidden');
        }

        cancelDeleteBtn.addEventListener('click', () => {
            deleteTargetTaskId = null;
            deleteModal.classList.add('hidden');
        });

        confirmDeleteBtn.addEventListener('click', async () => {
            if (!deleteTargetTaskId || !currentUser) return;
            try {
                const taskRef = doc(db, 'artifacts', 'task-flow-app', 'users', currentUser.uid, 'tasks', deleteTargetTaskId);
                await deleteDoc(taskRef);
                showToast("タスクを削除しました");
            } catch (error) {
                console.error("Delete error:", error);
                showToast("削除に失敗しました", "error");
            } finally {
                deleteTargetTaskId = null;
                deleteModal.classList.add('hidden');
            }
        });

        // Render UI, Filter and Calculate Statistics
        function renderApp() {
            // Calculate Stats
            const total = tasks.length;
            const completedCount = tasks.filter(t => t.completed).length;
            const activeCount = total - completedCount;
            const highPriorityCount = tasks.filter(t => t.priority === 'high' && !t.completed).length;

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statActive').textContent = activeCount;
            document.getElementById('statCompleted').textContent = completedCount;
            document.getElementById('statHighPriority').textContent = highPriorityCount;

            // Apply Filters
            const searchKeyword = searchInput.value.toLowerCase().trim();
            const statusVal = statusFilter.value;
            const categoryVal = categoryFilter.value;

            const filteredTasks = tasks.filter(task => {
                // Search match
                const matchesSearch = task.title.toLowerCase().includes(searchKeyword) || 
                                      (task.description && task.description.toLowerCase().includes(searchKeyword));
                
                // Status match
                const matchesStatus = statusVal === 'all' || 
                                     (statusVal === 'active' && !task.completed) || 
                                     (statusVal === 'completed' && task.completed);

                // Category match
                const matchesCategory = categoryVal === 'all' || task.category === categoryVal;

                return matchesSearch && matchesStatus && matchesCategory;
            });

            // Render Task Items
            tasksList.innerHTML = "";

            if (filteredTasks.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filteredTasks.forEach(task => {
                    const card = createTaskElement(task);
                    tasksList.appendChild(card);
                });
            }
        }

        // Create HTML Element for Single Task
        function createTaskElement(task) {
            const el = document.createElement('div');
            el.className = `bg-white border rounded-2xl p-4 transition-all duration-200 shadow-sm hover:shadow-md flex flex-col sm:flex-row sm:items-center justify-between gap-4 ${
                task.completed ? 'border-slate-200 bg-slate-50/60 opacity-75' : 'border-slate-200/80'
            }`;

            // Priority badge styling
            const priorityBadges = {
                high: 'bg-rose-50 text-rose-600 border-rose-200',
                medium: 'bg-amber-50 text-amber-600 border-amber-200',
                low: 'bg-emerald-50 text-emerald-600 border-emerald-200'
            };
            const priorityLabels = { high: '高', medium: '中', low: '低' };

            // Category badge styling
            const categoryLabels = { work: '仕事', personal: '個人', shopping: '買い物', other: 'その他' };

            const checkIcon = task.completed
                ? `<svg class="w-6 h-6 text-emerald-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>`
                : `<svg class="w-6 h-6 text-slate-300 hover:text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`;

            el.innerHTML = `
                <div class="flex items-start space-x-3 flex-1 min-w-0">
                    <!-- Complete Checkbox -->
                    <button class="toggle-btn text-xl mt-0.5 transition flex-shrink-0">
                        ${checkIcon}
                    </button>

                    <!-- Content -->
                    <div class="min-w-0 flex-1 space-y-1">
                        <div class="flex flex-wrap items-center gap-2">
                            <h4 class="font-semibold text-slate-800 text-base leading-snug break-words ${task.completed ? 'line-through text-slate-400' : ''}">
                                ${escapeHtml(task.title)}
                            </h4>
                        </div>

                        ${task.description ? `<p class="text-xs text-slate-500 line-clamp-2 ${task.completed ? 'line-through text-slate-400' : ''}">${escapeHtml(task.description)}</p>` : ''}

                        <!-- Metadata Badges -->
                        <div class="flex flex-wrap items-center gap-2 pt-1">
                            <!-- Priority -->
                            <span class="text-[11px] font-semibold px-2 py-0.5 rounded-md border ${priorityBadges[task.priority] || priorityBadges.medium}">
                                優先度: ${priorityLabels[task.priority] || '中'}
                            </span>
                            
                            <!-- Category -->
                            <span class="text-[11px] font-medium bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md">
                                ${categoryLabels[task.category] || 'その他'}
                            </span>

                            <!-- Due Date -->
                            ${task.dueDate ? `
                                <span class="text-[11px] font-medium text-slate-400 flex items-center space-x-1">
                                    <svg class="w-3.5 h-3.5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                                    <span>${task.dueDate}</span>
                                </span>
                            ` : ''}
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center space-x-1 border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-100 justify-end">
                    <button class="edit-btn text-slate-400 hover:text-indigo-600 p-2 rounded-lg hover:bg-slate-100 transition" title="編集">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                    </button>
                    <button class="delete-btn text-slate-400 hover:text-rose-600 p-2 rounded-lg hover:bg-slate-100 transition" title="削除">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                </div>
            `;

            // Attach event listeners
            el.querySelector('.toggle-btn').addEventListener('click', () => toggleTaskComplete(task));
            el.querySelector('.edit-btn').addEventListener('click', () => openTaskModal(task));
            el.querySelector('.delete-btn').addEventListener('click', () => promptDeleteTask(task.id));

            return el;
        }

        // Search & Filter event listeners
        searchInput.addEventListener('input', renderApp);
        statusFilter.addEventListener('change', renderApp);
        categoryFilter.addEventListener('change', renderApp);

        // Helper Utilities
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.textContent = message;
            if (type === 'error') {
                toastIcon.innerHTML = `<svg class="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`;
            } else {
                toastIcon.innerHTML = `<svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`;
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
